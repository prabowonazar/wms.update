name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: npm install

      - name: Build Vite Web Project
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "ScanGudang WMS" "com.scangudang.wms" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Camera Permission & Runtime Prompt
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            // 1. Patch AndroidManifest.xml with CAMERA & FLASHLIGHT permissions
            const manifestPath = "android/app/src/main/AndroidManifest.xml";
            if (fs.existsSync(manifestPath)) {
              let manifest = fs.readFileSync(manifestPath, "utf8");
              const permissions = [
                "<uses-permission android:name=\"android.permission.CAMERA\" />",
                "<uses-permission android:name=\"android.permission.FLASHLIGHT\" />",
                "<uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />",
                "<uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />"
              ];
              const missing = permissions.filter(p => !manifest.includes(p.match(/android:name="([^"]+)"/)[1]));
              if (missing.length > 0) {
                manifest = manifest.replace(
                  /<application\b/,
                  missing.join("\n    ") + "\n\n    <application"
                );
                fs.writeFileSync(manifestPath, manifest, "utf8");
                console.log("Patched AndroidManifest.xml with CAMERA permissions.");
              }
            }

            // 2. Patch MainActivity.java or MainActivity.kt to prompt runtime CAMERA permission on app launch
            const javaMain = "android/app/src/main/java/com/scangudang/wms/MainActivity.java";
            const ktMain = "android/app/src/main/java/com/scangudang/wms/MainActivity.kt";

            if (fs.existsSync(javaMain)) {
              const javaCode = `package com.scangudang.wms;

import android.Manifest;
import android.content.pm.PackageManager;
import android.os.Bundle;
import androidx.core.app.ActivityCompat;
import androidx.core.content.ContextCompat;
import com.getcapacitor.BridgeActivity;

public class MainActivity extends BridgeActivity {
  @Override
  public void onCreate(Bundle savedInstanceState) {
    super.onCreate(savedInstanceState);
    if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
      ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.CAMERA}, 1001);
    }
  }
}
`;
              fs.writeFileSync(javaMain, javaCode, "utf8");
              console.log("Patched MainActivity.java for runtime CAMERA permission prompt.");
            } else if (fs.existsSync(ktMain)) {
              const ktCode = `package com.scangudang.wms

import android.Manifest
import android.content.pm.PackageManager
import android.os.Bundle
import androidx.core.app.ActivityCompat
import androidx.core.content.ContextCompat
import com.getcapacitor.BridgeActivity

class MainActivity : BridgeActivity() {
  override fun onCreate(savedInstanceState: Bundle?) {
    super.onCreate(savedInstanceState)
    if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.CAMERA), 1001)
    }
  }
}
`;
              fs.writeFileSync(ktMain, ktCode, "utf8");
              console.log("Patched MainActivity.kt for runtime CAMERA permission prompt.");
            }
          '

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanGudang-WMS-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
