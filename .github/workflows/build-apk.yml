name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Accept Android SDK Licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Vite Web Project
        run: npm run build

      - name: Initialize & Sync Capacitor Android
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android
          if [ ! -f "capacitor.config.json" ]; then
            npx cap init "ScanGudang WMS" "com.scangudang.wms" --web-dir dist
          fi
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure Android Camera Permission & Runtime Prompt
        run: node .github/scripts/patch-android-permissions.cjs

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScanGudang-WMS-Debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
